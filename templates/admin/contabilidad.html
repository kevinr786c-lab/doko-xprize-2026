{% extends "base.html" %}
{% block contenido %}
<h1>Contabilidad Admin</h1>
<div class="card" style="background:white;padding:20px;border-radius:12px;margin-top:20px;">
    <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="border-bottom:2px solid var(--color-borde);">
            <th style="padding:10px;">Tipo</th><th style="padding:10px;">Concepto</th>
            <th style="padding:10px;">Monto</th><th style="padding:10px;">Fecha</th>
        </tr></thead>
        <tbody>
        {% for r in registros %}
        <tr style="border-bottom:1px solid var(--color-borde);">
            <td style="padding:10px;">{{ r.tipo }}</td>
            <td style="padding:10px;">{{ r.concepto }}</td>
            <td style="padding:10px;">${{ r.monto }}</td>
            <td style="padding:10px;">{{ r.fecha_documento }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
